[workspace]
members = ["crates/*"]
exclude = [
    "react-native",
    "react-native-reanimated",
    "bench/codegen/swc",
    "bench/worklets/swc",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
authors = ["Geunhyeok LEE <dev.ghlee@gmail.com>"]
repository = "https://github.com/leegeunhyeok/swc-plugin-codegen"
homepage = "https://github.com/leegeunhyeok/swc-plugin-codegen"
readme = "README.md"

[workspace.dependencies]
swc_common = { version = "26.0.0", features = ["sourcemap"] }
swc_atoms = "10.0.0"
swc_ecma_ast = "29.0.2"
swc_ecma_parser = { version = "45.1.6", features = ["flow", "typescript"] }
swc_ecma_visit = "29.0.0"
swc_ecma_codegen = "32.0.3"
swc_ecma_utils = "35.0.2"
swc_ecma_compat_es2015 = "55.0.1"
swc_ecma_compat_es2022 = "53.0.0"
swc_ecma_transformer = "21.0.2"
swc_ecma_transforms_base = "49.0.1"
swc_react_native_codegen = { path = "crates/swc-react-native-codegen", version = "0.2.1" }
swc_react_native_hermes_v1_fixes = { path = "crates/swc-react-native-hermes-v1-fixes", version = "0.2.1" }
swc_react_native_worklets = { path = "crates/swc-react-native-worklets", version = "0.2.1" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"
once_cell = "1"
rustc-hash = "2"
insta = { version = "1", features = ["glob"] }
