[package]
name = "bench_worklets_swc"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "bench_worklets_swc"
path = "src/main.rs"

[dependencies]
swc_common = { version = "26.0.0", features = ["sourcemap"] }
swc_ecma_ast = "29.0.2"
swc_ecma_parser = { version = "45.1.6", features = ["typescript"] }
swc_ecma_codegen = "32.0.3"
swc_ecma_visit = "29.0.0"
swc_react_native_worklets = { path = "../../../crates/swc-react-native-worklets" }
