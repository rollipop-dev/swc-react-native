swc_ecma_utils = { workspace = true }
swc_ecma_compat_es2015 = { workspace = true }
swc_ecma_compat_es2022 = { workspace = true }
swc_ecma_transformer = { workspace = true }
swc_ecma_transforms_base = { workspace = true, features = ["inline-helpers"] }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
once_cell = { workspace = true }
rustc-hash = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
